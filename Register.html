<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <link rel="stylesheet" href="Register.css">
</head>
<body>
<div class="container">

    <div class="left">

            <form action="process.php" method="POST">

                <h2>Create Account</h2>

                <label>First Name</label>
                <input type="text" id="fname" name="fname"
                    placeholder="Enter First Name" required>

                <label>Surname</label>
                <input type="text" id="sname" name="sname"
                    placeholder="Enter Surname" required>

                <label>Username</label>
                <input type="text" id="username" name="username"
                    placeholder="Enter Username" required>

                <label>Email Address</label>
                <input type="email" id="email" name="email"
                    placeholder="Enter Email Address" required>

                <label>Password</label>
                <input type="password" id="password" name="password"
                    placeholder="Enter Password" required>

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm Password" required>

                <div class="check">
                    <input type="checkbox" id="agree"
                        name="agree" value="yes" required>

                    <label for="agree">
                        I agree to the Terms & Conditions
                    </label>
                </div>

                <button type="submit" id="createAccount">
                    Create Account
                </button>

            </form>

        <p>
            Already have an account?
            <a href="StudentLogin.html">Sign In</a>
    </div>

    

    <div class="right">
        <a href="Home.html" class="back-home">← Back to Home</a>

        <h1>WELCOME TO</h1>

        <h1>STUDENT PORTAL</h1>

        <p>
            Join StudentHub and access attendance,
            results, academic records, notices,
            assignments and much more from one place.
        </p>

    </div>

</div>



<footer>
    ©2026 StudentHub | All Rights Reserved
</footer>

<script src="Register.js"></script>
<script src="Theme.js"></script>

</body>
</html>
